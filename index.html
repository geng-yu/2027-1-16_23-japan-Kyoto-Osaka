  <style>
    :root {
      --bg-color: #ffffff;
      --secondary-bg: #f0f2f6;
      --text-color: #262730;
      --subtext-color: #555867;
      --border-color: rgba(128, 128, 128, 0.3);
      --accent-red: #ff4b4b;
      --accent-red-bg: rgba(255, 75, 75, 0.12);
      --btn-bg: rgba(128, 128, 128, 0.18);
      --btn-hover: rgba(128, 128, 128, 0.35);
      --info-bg: #e8f4fd;
      --info-border: #1c83e1;
      --info-text: #0e4377;
      --warn-bg: #fff8e6;
      --warn-border: #f59e0b;
      --warn-text: #7c4a03;
      --err-bg: #fde8e8;
      --err-border: #ff4b4b;
      --err-text: #7f1d1d;
      --code-bg: #f5f7f9;
      --link-color: #0068c9;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-color: #0e1117;
        --secondary-bg: #262730;
        --text-color: #fafafa;
        --subtext-color: #a3a8b8;
        --border-color: rgba(250, 250, 250, 0.25);
        --btn-bg: rgba(128, 128, 128, 0.22);
        --btn-hover: rgba(128, 128, 128, 0.4);
        --info-bg: rgba(28, 131, 225, 0.18);
        --info-border: #3b9eff;
        --info-text: #d6ecff;
        --warn-bg: rgba(245, 158, 11, 0.18);
        --warn-border: #fbbf24;
        --warn-text: #fef3c7;
        --err-bg: rgba(255, 75, 75, 0.18);
        --err-border: #ff6b6b;
        --err-text: #ffd6d6;
        --code-bg: #1e222b;
        --link-color: #58a6ff;
      }
    }

    :root[data-theme="dark"] {
      --bg-color: #0e1117;
      --secondary-bg: #262730;
      --text-color: #fafafa;
      --subtext-color: #a3a8b8;
      --border-color: rgba(250, 250, 250, 0.25);
      --btn-bg: rgba(128, 128, 128, 0.22);
      --btn-hover: rgba(128, 128, 128, 0.4);
      --info-bg: rgba(28, 131, 225, 0.18);
      --info-border: #3b9eff;
      --info-text: #d6ecff;
      --warn-bg: rgba(245, 158, 11, 0.18);
      --warn-border: #fbbf24;
      --warn-text: #fef3c7;
      --err-bg: rgba(255, 75, 75, 0.18);
      --err-border: #ff6b6b;
      --err-text: #ffd6d6;
      --code-bg: #1e222b;
      --link-color: #58a6ff;
    }

    /* ===== 整頁只能上下滑，禁止左右 ===== */
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden !important;
      max-width: 100vw !important;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.55;
      -webkit-tap-highlight-color: transparent;
    }

    .main-container {
      max-width: 700px;
      margin: 0 auto;
      padding: 16px 14px 60px 14px;
      overflow-x: hidden;
    }

    /* ===== 標題與主題切換 ===== */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 1.85rem;
      margin: 0 0 4px 0;
      font-weight: 800;
    }
    .theme-toggle {
      background: var(--secondary-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .caption {
      font-size: 0.88rem;
      color: var(--subtext-color);
      margin-bottom: 12px;
    }

    /* ===== 日期選單：只有這一列可以左右滑 ===== */
    .day-radio-group {
      display: flex !important;
      flex-direction: row !important;
      flex-wrap: nowrap !important;
      overflow-x: auto !important;
      overflow-y: hidden;
      gap: 8px;
      padding-bottom: 6px;
      margin-bottom: 12px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .day-radio-group::-webkit-scrollbar {
      display: none;
    }
    .day-option {
      flex: 0 0 auto;
      background-color: var(--secondary-bg);
      color: var(--text-color);
      padding: 6px 10px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-width: 74px;
      height: 55px;
      font-size: 14px;
      line-height: 1.3;
      font-weight: bold;
      white-space: pre-wrap;
      user-select: none;
    }
    .day-option.active {
      border: 2px solid var(--accent-red) !important;
      background-color: var(--accent-red-bg) !important;
    }

    /* ===== 優惠券區塊 ===== */
    .coupon-box {
      font-size: 0.92rem;
      margin: 8px 0 16px 0;
      line-height: 1.7;
    }
    .coupon-box a {
      color: var(--link-color);
      text-decoration: none;
      font-weight: 600;
    }
    .coupon-box a:hover {
      text-decoration: underline;
    }

    /* ===== 內容與排版 ===== */
    .day-title {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 12px 0 4px 0;
    }
    .subheader {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 18px 0 8px 0;
    }
    ul {
      margin: 6px 0 12px 0;
      padding-left: 20px;
    }
    li {
      margin-bottom: 4px;
      font-size: 0.96rem;
    }
    hr {
      border: none;
      border-top: 1px solid var(--border-color);
      margin: 18px 0;
    }
    .border-card {
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 14px;
    }
    .border-card h3 {
      margin: 0 0 6px 0;
      font-size: 1.1rem;
    }

    /* ===== 導航按鈕：灰底、白框（亮模式自動變黑框） ===== */
    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 9px 10px;
      margin: 6px 0;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.92rem;
      border: 1.5px solid var(--text-color) !important;
      background-color: var(--btn-bg) !important;
      color: var(--text-color) !important;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: background-color 0.15s;
    }
    .link-btn:hover, .link-btn:active {
      background-color: var(--btn-hover) !important;
    }

    /* ===== 多欄並排：手機不換行、不撐寬 ===== */
    .cols {
      display: flex;
      flex-wrap: nowrap !important;
      gap: 6px;
      width: 100%;
      max-width: 100%;
      margin: 4px 0;
    }
    .cols > .col {
      min-width: 0 !important;
      flex: 1 1 0 !important;
    }

    /* ===== MapCode 區塊 ===== */
    .code-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--code-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 6px 10px;
      margin: 6px 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.84rem;
      overflow-x: auto;
    }
    

    /* ===== 摺疊區 (Expander) 與 表格 ===== */
    details.expander {
      border: 1px solid var(--border-color);
      border-radius: 10px;
      margin: 10px 0;
      background-color: var(--bg-color);
      overflow: hidden;
    }
    details.expander summary {
      padding: 10px 14px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--secondary-bg);
    }
    details.expander summary::-webkit-details-marker {
      display: none;
    }
    details.expander summary::after {
      content: "▼";
      font-size: 0.75rem;
      transition: transform 0.2s;
    }
    details.expander[open] summary::after {
      transform: rotate(180deg);
    }
    .expander-body {
      padding: 10px 12px;
    }

    /* ===== Markdown 表格自動換行、不撐寬 ===== */
    .food-table {
      width: 100% !important;
      table-layout: fixed;
      border-collapse: collapse;
      margin-top: 6px;
    }
    .food-table th, .food-table td {
      border: 1px solid var(--border-color);
      white-space: normal !important;
      word-break: break-word;
      font-size: 13px;
      padding: 6px 6px;
      text-align: left;
      vertical-align: top;
    }
    .food-table th {
      background-color: var(--secondary-bg);
      font-weight: 700;
    }
    .food-table th:nth-child(1), .food-table td:nth-child(1) { width: 36%; }
    .food-table th:nth-child(2), .food-table td:nth-child(2) { width: 22%; }
    .food-table td a {
      color: var(--link-color);
      text-decoration: none;
      font-weight: 600;
    }

    /* ===== 提示框 (info / warning / error) ===== */
    .alert {
      border-radius: 10px;
      padding: 12px 14px;
      margin: 12px 0;
      font-size: 0.93rem;
      border-left: 4px solid;
    }
    .alert p { margin: 0 0 6px 0; font-weight: 700; }
    .alert ul { margin: 4px 0 0 0; }
    .alert-info {
      background-color: var(--info-bg);
      border-left-color: var(--info-border);
      color: var(--info-text);
    }
    .alert-warn {
      background-color: var(--warn-bg);
      border-left-color: var(--warn-border);
      color: var(--warn-text);
    }
    .alert-error {
      background-color: var(--err-bg);
      border-left-color: var(--err-border);
      color: var(--err-text);
    }
    details.expander.expander-error {
  background-color: var(--err-bg);
  border-color: var(--err-border);
}
details.expander.expander-error summary,
details.expander.expander-error .expander-body {
  background-color: var(--err-bg);
  color: var(--err-text);
}

    .day-pane { display: none; }
    .day-pane.active { display: block; }
  </style>
</head>

// 產生 UI 元件輔助函式
function btn(label, query, mode = "transit") {
  return `<a class="link-btn" href="${getGmapLink(query, mode)}" target="_blank" rel="noopener">${label}</a>`;
}

function codeBlock(text) {
  return `
    <div class="code-box">
      <span>${text}</span>
    </div>
  `;
}

function showFoodTable(region) {
  // 相容 day2.py 的「河原町-吃」與「河原町-逛」
  const aliasMap = {
    "河原町-吃": "四條河原町",
    "河原町-逛": "新京極寺町"
  };
  const actualKey = aliasMap[region] || region;
  const rows = DATA_SOURCE[actualKey];
  if (!rows) return "";

  const trs = rows.map(r => {
    const url = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r["店名"])}`;
    const note = r["備註"].replace(/\|/g, "｜");
    return `<tr>
      <td><a href="${url}" target="_blank" rel="noopener">📍 ${r["店名"]}</a></td>
      <td>${r["時間"]}</td>
      <td>${note}</td>
    </tr>`;
  }).join("");

  return `
    <details class="expander">
      <summary>🍽️ ${region} 周邊</summary>
      <div class="expander-body">
        <div class="caption" style="margin-bottom:6px;">營業時間以官網為準，點店名開 Google Maps</div>
        <table class="food-table">
          <thead><tr><th>店名</th><th>時間</th><th>備註</th></tr></thead>
          <tbody>${trs}</tbody>
        </table>
      </div>
    </details>
  `;
}

// ==========================================
// 4. 初始化渲染與日本時間自動定位
// ==========================================
const navEl = document.getElementById("dayNav");
const containerEl = document.getElementById("daysContainer");

// 取得日本東京當前日期 (YYYY-MM-DD)
const japanToday = new Intl.DateTimeFormat("en-CA", {
  timeZone: "Asia/Tokyo",
  year: "numeric",
  month: "2-digit",
  day: "2-digit"
}).format(new Date());

let defaultIndex = 0;
TRIP_DAYS.forEach((d, idx) => {
  if (d.date === japanToday) defaultIndex = idx;
});

TRIP_DAYS.forEach((d, idx) => {
  // 建立按鈕
  const btnEl = document.createElement("div");
  btnEl.className = "day-option" + (idx === defaultIndex ? " active" : "");
  btnEl.textContent = d.key;
  btnEl.onclick = () => selectDay(idx);
  navEl.appendChild(btnEl);

  // 建立內容區塊
  const paneEl = document.createElement("div");
  paneEl.className = "day-pane" + (idx === defaultIndex ? " active" : "");
  paneEl.id = `day-pane-${idx}`;
  paneEl.innerHTML = `
    <div class="day-title">${d.fullTitle}</div>
    <div class="caption">${d.caption}</div>
    ${d.html}
  `;
  containerEl.appendChild(paneEl);
});

function selectDay(index) {
  document.querySelectorAll(".day-option").forEach((el, i) => {
    el.classList.toggle("active", i === index);
  });
  document.querySelectorAll(".day-pane").forEach((el, i) => {
    el.classList.toggle("active", i === index);
  });
}

// 深淺色模式切換
const themeBtn = document.getElementById("themeBtn");
themeBtn.addEventListener("click", () => {
  const root = document.documentElement;
  const current = root.getAttribute("data-theme");
  const isSystemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  if (!current) {
    root.setAttribute("data-theme", isSystemDark ? "light" : "dark");
  } else {
    root.setAttribute("data-theme", current === "dark" ? "light" : "dark");
  }
});
</script>
